<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Assignment</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    h2 {
      color: rgb(167, 167, 249);
    }

    #output {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #f0d8d8;
    }

    #saved {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>JavaScript Assignment</h1>

<!-- FETCH API -->
<h2>Fetch API Output (Users)</h2>
<div id="output">Loading users...</div>

<!-- LOCAL STORAGE -->
<h2>Local Storage Form</h2>

<form id="form">
  <input type="text" id="name" placeholder="Enter Name" required>
  <input type="email" id="email" placeholder="Enter Email" required>
  <button type="submit">Save</button>
</form>

<p id="saved"></p>
<button onclick="clearData()">Clear Data</button>

<!-- PROJECT OUTPUT -->
<h2>Users (Project API)</h2>
<div id="users"></div>
<p id="selected"></p>

<!-- INFO -->
<h2>Console Output</h2>
<ul>
  <li>Promises result</li>
  <li>Async/Await result</li>
  <li>Joke API result</li>
  <li>Module output (main.js)</li>
</ul>

<!-- NORMAL SCRIPTS -->
<script src="promises.js"></script>
<script src="async-await.js"></script>
<script src="fetch-api.js"></script>
<script src="local-storage.js"></script>
<script src="project.js"></script>

<!-- MODULE ENTRY (IMPORTANT FIX) -->
<script type="module" src="modules/main.js"></script>

</body>
</html>
